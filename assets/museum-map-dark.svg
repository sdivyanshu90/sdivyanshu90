<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Floor plan of the Museum of Edge Cases</title><desc id="desc">Six galleries surround the Reality Atrium, representing evaluation, neural debugging, quantization, routing, distributed training, and secure execution.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111116"/><stop offset="1" stop-color="#0c0d11"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#d9cfbe" opacity=".12"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.serif{font-family:Georgia,"Times New Roman",serif}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.room{fill:#17171d;stroke:#756e63;stroke-width:1.2}.code{fill:#938b7e;font-size:8px;letter-spacing:1.6px}.name{fill:#ede6da;font-size:15px;font-weight:700}.artifact{fill:#9e978c;font-size:9px}.path{stroke-dasharray:4 8;animation:route 9s linear infinite}.visitor{offset-path:path("M600 526 V434 H970 V338 H1060 V168 H970 V120 H600 H230 V168 H140 V338 H230 V434 H600 V350");animation:walk 14s linear infinite}@keyframes route{to{stroke-dashoffset:-120}}@keyframes walk{to{offset-distance:100%}}@media(prefers-reduced-motion:reduce){.path,.visitor{animation:none}.visitor{display:none}}</style></defs>
  <rect x="1" y="1" width="1198" height="568" rx="22" fill="url(#bg)" stroke="#554f47" stroke-width="2"/><rect x="1" y="1" width="1198" height="568" rx="22" fill="url(#dots)"/><text x="38" y="43" class="mono" fill="#b2a99a" font-size="11" letter-spacing="2.2">VISITOR MAP // PERMANENT COLLECTION</text><text x="1162" y="43" class="mono" fill="#716a60" font-size="9" letter-spacing="1.4" text-anchor="end">PLEASE DO NOT CROSS THE ABSTRACTION</text>
  <rect x="60" y="72" width="1080" height="448" rx="4" fill="none" stroke="#8a8173" stroke-width="2"/><path d="M600 520V350M380 250H450M750 250H820M600 140V170" stroke="#615a51" stroke-width="26"/><path d="M600 520V350M380 250H450M750 250H820M600 140V170" stroke="#c3b9aa" stroke-width="1" opacity=".5" class="path"/>
  <g transform="translate(82 94)"><rect class="room" width="298" height="142"/><text x="18" y="24" class="mono code">GALLERY 01 · EVALUATION</text><text x="18" y="57" class="serif name">THE HALL OF</text><text x="18" y="79" class="serif name">FALSE CONFIDENCE</text><text x="18" y="111" class="mono artifact">ON VIEW · EVALFORGE</text><circle cx="267" cy="31" r="12" fill="none" stroke="#8ca2ff"/><path d="M260 31H274M267 24V38" stroke="#8ca2ff"/></g>
  <g transform="translate(82 280)"><rect class="room" width="298" height="142"/><text x="18" y="24" class="mono code">GALLERY 02 · DEBUGGING</text><text x="18" y="57" class="serif name">THE CHECKPOINT THAT</text><text x="18" y="79" class="serif name">CHANGED ITS MIND</text><text x="18" y="111" class="mono artifact">ON VIEW · NEURAL BISECT</text><circle cx="267" cy="31" r="12" fill="none" stroke="#8ca2ff"/><path d="M259 31H275M267 23V39M261 25L273 37" stroke="#8ca2ff"/></g>
  <g transform="translate(450 82)"><rect class="room" width="300" height="88"/><text x="18" y="24" class="mono code">GALLERY 03 · EFFICIENCY</text><text x="18" y="53" class="serif name">THE COMPRESSION CHAMBER</text><text x="18" y="73" class="mono artifact">ON VIEW · FROM-SCRATCH QUANTIZATION</text></g>
  <g transform="translate(820 94)"><rect class="room" width="298" height="142"/><text x="18" y="24" class="mono code">GALLERY 04 · ROUTING</text><text x="18" y="57" class="serif name">THE VANISHING</text><text x="18" y="79" class="serif name">PROVIDER</text><text x="18" y="111" class="mono artifact">ON VIEW · AI GATEWAY</text><circle cx="267" cy="31" r="12" fill="none" stroke="#ff8a76"/><path d="M259 31H275" stroke="#ff8a76"/></g>
  <g transform="translate(820 280)"><rect class="room" width="298" height="142"/><text x="18" y="24" class="mono code">GALLERY 05 · SCALE</text><text x="18" y="57" class="serif name">THE DISTRIBUTED</text><text x="18" y="79" class="serif name">LABYRINTH</text><text x="18" y="111" class="mono artifact">ON VIEW · DISTRIBUTED TRAINING</text><circle cx="267" cy="31" r="12" fill="none" stroke="#ff8a76"/><path d="M259 25H268V37H275M263 31H272" fill="none" stroke="#ff8a76"/></g>
  <g transform="translate(450 350)"><rect class="room" width="300" height="142"/><text x="18" y="24" class="mono code">GALLERY 06 · SECURITY</text><text x="18" y="57" class="serif name">THE CONTAINMENT WING</text><text x="18" y="89" class="mono artifact">ON VIEW · CODE INTERPRETER</text><path d="M252 26V57H278V26L265 18Z" fill="none" stroke="#d89cff"/><circle cx="265" cy="39" r="5" fill="none" stroke="#d89cff"/></g>
  <g transform="translate(450 170)"><rect width="300" height="180" fill="#111116" stroke="#d89cff" stroke-width="1.8"/><rect x="13" y="13" width="274" height="154" fill="none" stroke="#6d5d75" stroke-dasharray="3 7"/><text x="150" y="63" class="mono" fill="#8e8190" font-size="9" letter-spacing="2" text-anchor="middle">CENTRAL ATRIUM</text><text x="150" y="103" class="serif" fill="#f1e8db" font-size="29" text-anchor="middle">REALITY</text><text x="150" y="133" class="serif" fill="#bdafbd" font-size="14" font-style="italic" text-anchor="middle">the permanent stress test</text></g>
  <g transform="translate(558 510)"><path d="M0 0H84L72 26H12Z" fill="#1a1920" stroke="#8a8173"/><text x="42" y="17" class="mono" fill="#d8cebf" font-size="8" letter-spacing="1.4" text-anchor="middle">ENTRANCE</text></g><circle cx="600" cy="526" r="7" fill="#ff8a76" filter="url(#glow)" class="visitor"/><text x="682" y="548" class="mono" fill="#827a6e" font-size="8" letter-spacing="1.3">YOU ARE HERE · PROBABLY</text>
</svg>
