<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">AI systems signal path</title><desc id="desc">Six connected systems move from distributed training through optimization, routing, evaluation, diagnosis, and secure execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081421"/><stop offset="1" stop-color="#07101a"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#193247" opacity=".45"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#46e6ff"/></marker>
    <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.k{fill:#698399;font-size:9px;letter-spacing:1.5px}.t{fill:#e7f5fb;font-size:13px;font-weight:700}.s{fill:#8ba2b4;font-size:10px}.flow{stroke-dasharray:7 10;animation:move 7s linear infinite}@keyframes move{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  </defs>
  <rect x="1" y="1" width="1198" height="398" rx="22" fill="url(#bg)" stroke="#1b3c51" stroke-width="2"/><rect x="1" y="1" width="1198" height="398" rx="22" fill="url(#grid)"/><text x="42" y="46" class="mono" fill="#74e9f9" font-size="11" letter-spacing="2">SYSTEM MAP // ONE RELIABILITY LOOP</text><text x="1158" y="46" class="mono" fill="#5d788c" font-size="10" letter-spacing="1.4" text-anchor="end">TRACE 06 SYSTEMS</text>
  <path d="M150 180H1032" fill="none" stroke="#46e6ff" stroke-width="1.5" opacity=".72" marker-end="url(#arrow)" class="flow"/><path d="M750 215V300H942" fill="none" stroke="#7cffb2" stroke-width="1.4" opacity=".7" marker-end="url(#arrow)" class="flow"/>
  <g transform="translate(58 118)"><rect width="184" height="124" rx="13" fill="#0b1e2e" stroke="#28566c"/><text x="18" y="27" class="mono k">01 · CREATE</text><text x="18" y="57" class="sans t">Distributed Training</text><text x="18" y="81" class="mono s">FSDP / ZeRO-3</text><text x="18" y="101" class="mono s">tensor parallelism</text></g><g transform="translate(274 118)"><rect width="184" height="124" rx="13" fill="#0b1e2e" stroke="#28566c"/><text x="18" y="27" class="mono k">02 · COMPRESS</text><text x="18" y="57" class="sans t">FromScratchQuant</text><text x="18" y="81" class="mono s">INT8 / FP4 / NF4</text><text x="18" y="101" class="mono s">validated numerics</text></g><g transform="translate(490 118)"><rect width="184" height="124" rx="13" fill="#0b1e2e" stroke="#2f7184"/><text x="18" y="27" class="mono k">03 · ROUTE</text><text x="18" y="57" class="sans t">AI Gateway</text><text x="18" y="81" class="mono s">failover / limits</text><text x="18" y="101" class="mono s">cache / observability</text></g><g transform="translate(706 118)"><rect width="184" height="124" rx="13" fill="#0b1e2e" stroke="#2f7184"/><text x="18" y="27" class="mono k">04 · MEASURE</text><text x="18" y="57" class="sans t">EvalForge</text><text x="18" y="81" class="mono s">deterministic scorers</text><text x="18" y="101" class="mono s">regression workflows</text></g><g transform="translate(922 118)"><rect width="184" height="124" rx="13" fill="#0b1e2e" stroke="#39785b"/><text x="18" y="27" class="mono k">05 · EXPLAIN</text><text x="18" y="57" class="sans t">Neural Bisect</text><text x="18" y="81" class="mono s">representations</text><text x="18" y="101" class="mono s">causal evidence</text></g>
  <g transform="translate(706 280)"><rect width="400" height="74" rx="12" fill="#0b1e2e" stroke="#39785b"/><circle cx="29" cy="37" r="7" fill="#7cffb2" opacity=".9" filter="url(#glow)"/><text x="51" y="31" class="mono k">06 · CONTAIN UNTRUSTED EXECUTION</text><text x="51" y="53" class="sans t">Code Interpreter</text><text x="214" y="53" class="mono s">namespaces / seccomp / cgroups</text></g>
