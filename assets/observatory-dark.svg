<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">DIV/90 AI Systems Observatory</title>
  <desc id="desc">A control-room interface connecting training, inference, evaluation, debugging, routing, and secure execution around reliability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#091827"/><stop offset="1" stop-color="#06101a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#46e6ff"/><stop offset="1" stop-color="#7cffb2"/></linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="58%"><stop stop-color="#153a4c"/><stop offset="0.72" stop-color="#0a1c2c"/><stop offset="1" stop-color="#07131f"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#173147" stroke-width="1" opacity=".52"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7892a8;font-size:12px;letter-spacing:2.2px}.node{fill:#b7c8d8;font-size:11px;font-weight:700;letter-spacing:1.5px;text-anchor:middle}.node-sub{fill:#5f7a91;font-size:8px;letter-spacing:1.3px;text-anchor:middle}.signal{stroke-dasharray:8 12;animation:flow 8s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}.pulse-b{animation-delay:-1.6s}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.86)}50%{opacity:1;transform:scale(1.14)}}@media (prefers-reduced-motion:reduce){.signal,.pulse{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="518" rx="25" fill="url(#bg)" stroke="#1a3a50" stroke-width="2"/><rect x="1" y="1" width="1198" height="518" rx="25" fill="url(#grid)" opacity=".52"/><path d="M25 92H1175" stroke="#1a3a50"/>
  <circle cx="42" cy="46" r="5" fill="#7cffb2" filter="url(#glow)" class="pulse"/><text x="60" y="51" class="mono" fill="#9fb5c7" font-size="13" letter-spacing="2">DIV/90 // SYSTEMS OBSERVATORY</text><text x="1158" y="51" class="mono" fill="#57748b" font-size="11" letter-spacing="1.5" text-anchor="end">SIGNAL: NOMINAL</text>
  <text x="55" y="140" class="mono label">APPLIED AI / ML SYSTEMS ENGINEER</text><text x="55" y="199" class="sans" fill="#eef8ff" font-size="46" font-weight="750" letter-spacing="-1.2">I build the layer between</text><text x="55" y="252" class="sans" fill="url(#accent)" font-size="46" font-weight="750" letter-spacing="-1.2">“the model works”</text><text x="55" y="305" class="sans" fill="#eef8ff" font-size="36" font-weight="750" letter-spacing="-1">and “the system survives reality.”</text><text x="58" y="353" class="sans" fill="#8ea6b9" font-size="15">Evaluation · infrastructure · inference · retrieval · reliability</text>
  <g transform="translate(910 282)">
    <ellipse rx="206" ry="148" fill="none" stroke="#23465b" stroke-width="1.2" stroke-dasharray="3 8"/><ellipse rx="148" ry="104" fill="none" stroke="#1c5368" stroke-width="1" opacity=".8"/><path d="M-178 -74C-92 -152 100 -158 184 -54" fill="none" stroke="#46e6ff" stroke-width="1.6" opacity=".72" class="signal"/><path d="M173 76C77 158 -102 151 -181 58" fill="none" stroke="#7cffb2" stroke-width="1.6" opacity=".62" class="signal"/>
    <circle r="72" fill="url(#core)" stroke="#46e6ff" stroke-width="1.5"/><circle r="61" fill="none" stroke="#2b7185" stroke-dasharray="2 7"/><circle r="7" fill="#46e6ff" filter="url(#glow)" class="pulse pulse-b"/><text y="-15" class="mono" fill="#6f8ba0" font-size="9" letter-spacing="2" text-anchor="middle">CORE DIRECTIVE</text><text y="11" class="mono" fill="#e8f9ff" font-size="15" font-weight="700" letter-spacing="1.7" text-anchor="middle">RELIABILITY</text><text y="33" class="mono" fill="#62dff4" font-size="9" letter-spacing="1.4" text-anchor="middle">UNDER LOAD</text>
    <g transform="translate(-177 -75)"><circle r="29" fill="#0a1a29" stroke="#2c7188"/><text y="-2" class="mono node">TRAIN</text><text y="12" class="mono node-sub">SCALE</text></g><g transform="translate(0 -148)"><circle r="29" fill="#0a1a29" stroke="#2c7188"/><text y="-2" class="mono node">EVAL</text><text y="12" class="mono node-sub">MEASURE</text></g><g transform="translate(179 -72)"><circle r="29" fill="#0a1a29" stroke="#2c7188"/><text y="-2" class="mono node">ROUTE</text><text y="12" class="mono node-sub">RECOVER</text></g><g transform="translate(177 76)"><circle r="29" fill="#0a1a29" stroke="#39785b"/><text y="-2" class="mono node">SECURE</text><text y="12" class="mono node-sub">CONTAIN</text></g><g transform="translate(0 148)"><circle r="29" fill="#0a1a29" stroke="#39785b"/><text y="-2" class="mono node">DEBUG</text><text y="12" class="mono node-sub">EXPLAIN</text></g><g transform="translate(-181 72)"><circle r="29" fill="#0a1a29" stroke="#39785b"/><text y="-2" class="mono node">INFER</text><text y="12" class="mono node-sub">OPTIMIZE</text></g>
  </g>
  <g transform="translate(55 430)"><rect width="214" height="38" rx="8" fill="#0b1e2e" stroke="#21475d"/><text x="15" y="24" class="mono" fill="#7cffb2" font-size="11">01</text><text x="46" y="24" class="mono" fill="#adc2d2" font-size="11">FOUNDING ENGINEER</text><rect x="228" width="213" height="38" rx="8" fill="#0b1e2e" stroke="#21475d"/><text x="243" y="24" class="mono" fill="#7cffb2" font-size="11">02</text><text x="274" y="24" class="mono" fill="#adc2d2" font-size="11">OPEN SOURCE</text><rect x="455" width="214" height="38" rx="8" fill="#0b1e2e" stroke="#21475d"/><text x="470" y="24" class="mono" fill="#7cffb2" font-size="11">03</text><text x="501" y="24" class="mono" fill="#adc2d2" font-size="11">FROM FIRST PRINCIPLES</text></g>
</svg>
