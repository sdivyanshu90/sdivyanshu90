<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Incident 90: The model worked, then reality happened</title><desc id="desc">An animated incident console where six boundary faults orbit a production AI system and route toward a reliability engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060914"/><stop offset=".55" stop-color="#0a1120"/><stop offset="1" stop-color="#080b13"/></linearGradient><linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff4d8d"/><stop offset=".52" stop-color="#ff8a4c"/><stop offset="1" stop-color="#ffd166"/></linearGradient><linearGradient id="cold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#45dfff"/><stop offset="1" stop-color="#74ffbd"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#202c42" opacity=".5"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.dash{stroke-dasharray:7 11;animation:flow 7s linear infinite}.blink{animation:blink 2.4s ease-in-out infinite}.b2{animation-delay:-.8s}.b3{animation-delay:-1.6s}.packet{offset-path:path("M702 275 C770 130 1000 130 1098 276 C1012 421 778 421 702 275");animation:travel 8s linear infinite}.scan{animation:scan 5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-126}}@keyframes blink{0%,100%{opacity:.28}50%{opacity:1}}@keyframes travel{to{offset-distance:100%}}@keyframes scan{0%,100%{transform:translateY(-22px);opacity:.2}50%{transform:translateY(22px);opacity:.8}}@media(prefers-reduced-motion:reduce){.dash,.blink,.packet,.scan{animation:none}.packet{display:none}}</style>
  </defs>
  <rect x="1" y="1" width="1198" height="618" rx="25" fill="url(#bg)" stroke="#293650" stroke-width="2"/><rect x="1" y="1" width="1198" height="618" rx="25" fill="url(#grid)"/>
  <path d="M26 82H1174" stroke="#28344c"/><circle cx="42" cy="41" r="6" fill="#ff4d8d" filter="url(#glow)" class="blink"/><text x="61" y="46" class="mono" fill="#cad4e3" font-size="12" letter-spacing="2">DIV/90 // INCIDENT CONSOLE</text><text x="1158" y="46" class="mono" fill="#ff759f" font-size="10" letter-spacing="1.6" text-anchor="end">INCIDENT ACTIVE · OPERATOR ONLINE</text>
  <text x="54" y="133" class="mono" fill="#71829c" font-size="11" letter-spacing="2">PRODUCTION TRACE // 02:17:43 UTC</text><text x="54" y="195" class="sans" fill="#f2f6ff" font-size="50" font-weight="800" letter-spacing="-1.4">THE MODEL</text><text x="54" y="248" class="sans" fill="url(#cold)" font-size="50" font-weight="800" letter-spacing="-1.4">WORKED.</text><text x="54" y="318" class="sans" fill="#f2f6ff" font-size="50" font-weight="800" letter-spacing="-1.4">THEN REALITY</text><text x="54" y="371" class="sans" fill="url(#hot)" font-size="50" font-weight="800" letter-spacing="-1.4">HAPPENED.</text><text x="57" y="412" class="mono" fill="#8d9cb2" font-size="12" letter-spacing="1.1">TRACE THE BOUNDARY. FIND WHAT WAS LOST.</text>
  <g transform="translate(890 276)">
    <ellipse rx="215" ry="158" fill="#08111f" stroke="#2a3954"/><ellipse rx="175" ry="120" fill="none" stroke="#354661" stroke-dasharray="3 8"/><path d="M-188 0C-120-142 118-142 208 0C126 143-112 143-188 0Z" fill="none" stroke="#45dfff" stroke-width="1.5" opacity=".7" class="dash"/>
    <path d="M0-77L67-39V39L0 77-67 39V-39Z" fill="#101a2b" stroke="#ff658e" stroke-width="2"/><path d="M0-62L54-31V31L0 62-54 31V-31Z" fill="none" stroke="#7b3c59" stroke-dasharray="3 7"/><path d="M-45 0H45" stroke="#ff658e" opacity=".48" class="scan"/>
    <text y="-28" class="mono" fill="#798aa2" font-size="8" letter-spacing="1.7" text-anchor="middle">FAULT DOMAIN</text><text y="-2" class="mono" fill="#fff2f6" font-size="16" font-weight="700" letter-spacing="1.6" text-anchor="middle">REALITY</text><text y="20" class="mono" fill="#ff759f" font-size="9" letter-spacing="1.5" text-anchor="middle">BOUNDARY</text><text y="39" class="mono" fill="#71839d" font-size="8" letter-spacing="1.2" text-anchor="middle">6 SIGNALS</text>
    <g class="mono" font-size="9" letter-spacing="1.2" text-anchor="middle"><g transform="translate(-162 -84)"><circle r="24" fill="#101a2b" stroke="#45dfff"/><circle r="4" fill="#45dfff" filter="url(#glow)" class="blink"/><text y="40" fill="#9babbe">IDENTITY</text></g><g transform="translate(0 -150)"><circle r="24" fill="#101a2b" stroke="#45dfff"/><circle r="4" fill="#45dfff" filter="url(#glow)" class="blink b2"/><text y="40" fill="#9babbe">TIME</text></g><g transform="translate(166 -82)"><circle r="24" fill="#101a2b" stroke="#45dfff"/><circle r="4" fill="#45dfff" filter="url(#glow)" class="blink b3"/><text y="40" fill="#9babbe">ENCODING</text></g><g transform="translate(166 84)"><circle r="24" fill="#101a2b" stroke="#74ffbd"/><circle r="4" fill="#74ffbd" filter="url(#glow)" class="blink"/><text y="40" fill="#9babbe">TRUST</text></g><g transform="translate(0 150)"><circle r="24" fill="#101a2b" stroke="#74ffbd"/><circle r="4" fill="#74ffbd" filter="url(#glow)" class="blink b2"/><text y="40" fill="#9babbe">SCALE</text></g><g transform="translate(-162 84)"><circle r="24" fill="#101a2b" stroke="#74ffbd"/><circle r="4" fill="#74ffbd" filter="url(#glow)" class="blink b3"/><text y="40" fill="#9babbe">STATE</text></g></g>
  </g>
  <circle cx="702" cy="275" r="6" fill="#ffd166" filter="url(#glow)" class="packet"/>
  <g transform="translate(54 476)"><rect width="1092" height="91" rx="12" fill="#080e19" stroke="#2c3950"/><circle cx="20" cy="19" r="4" fill="#ff658e"/><circle cx="35" cy="19" r="4" fill="#ffd166"/><circle cx="50" cy="19" r="4" fill="#74ffbd"/><text x="20" y="46" class="mono" fill="#657892" font-size="10">$ div90 trace --incident production --follow</text><text x="20" y="69" class="mono" fill="#d7e2ee" font-size="11">6 boundary faults detected</text><text x="248" y="69" class="mono" fill="#556a85" font-size="11">/</text><text x="270" y="69" class="mono" fill="#74ffbd" font-size="11">operator online</text><text x="406" y="69" class="mono" fill="#556a85" font-size="11">/</text><text x="428" y="69" class="mono" fill="#45dfff" font-size="11">diagnostic routes armed ↓</text></g>
</svg>
