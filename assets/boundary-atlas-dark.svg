<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">The Boundary Atlas</title><desc id="desc">A map of six recurring failure families: identity, time, encoding, trust, scale, and state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07121f"/><stop offset="1" stop-color="#091722"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#183247" opacity=".48"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.idx{fill:#5f7b8e;font-size:9px;letter-spacing:1.4px}.name{fill:#e7f5fb;font-size:15px;font-weight:750}.sub{fill:#7f99aa;font-size:10px}.route{stroke-dasharray:5 9;animation:route 9s linear infinite}@keyframes route{to{stroke-dashoffset:-140}}@media(prefers-reduced-motion:reduce){.route{animation:none}}</style>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="22" fill="url(#bg)" stroke="#1b3d52" stroke-width="2"/><rect x="1" y="1" width="1198" height="428" rx="22" fill="url(#grid)"/>
  <text x="40" y="44" class="mono" fill="#72e9fa" font-size="11" letter-spacing="2.1">FAULT ATLAS // WHAT GETS LOST AT A BOUNDARY?</text><text x="1160" y="44" class="mono" fill="#5d788b" font-size="10" letter-spacing="1.4" text-anchor="end">6 RECURRING VECTORS</text>
  <g fill="none" stroke-width="1.5" opacity=".72" class="route"><path d="M246 131L526 200" stroke="#46e6ff"/><path d="M482 102L558 182" stroke="#46e6ff"/><path d="M718 102L642 182" stroke="#46e6ff"/><path d="M954 131L674 200" stroke="#7cffb2"/><path d="M866 323L650 248" stroke="#7cffb2"/><path d="M334 323L550 248" stroke="#7cffb2"/></g>
  <g transform="translate(600 216)"><path d="M0-67L58-34V34L0 67-58 34V-34Z" fill="#0b2231" stroke="#46e6ff" stroke-width="1.6"/><path d="M0-54L47-27V27L0 54-47 27V-27Z" fill="none" stroke="#2a6a7e" stroke-dasharray="3 7"/><circle r="6" fill="#7cffb2" filter="url(#glow)"/><text y="-16" class="mono" fill="#6d899b" font-size="8" letter-spacing="1.8" text-anchor="middle">CORE QUESTION</text><text y="9" class="mono" fill="#ecfbff" font-size="14" font-weight="700" letter-spacing="1.6" text-anchor="middle">WHAT CROSSED?</text><text y="29" class="mono" fill="#62dff4" font-size="8" letter-spacing="1.4" text-anchor="middle">WHAT WAS LOST?</text></g>
  <g transform="translate(55 91)"><rect width="245" height="80" rx="12" fill="#0b1e2e" stroke="#285a70"/><text x="17" y="23" class="mono idx">01 · CACHE / KEYS</text><text x="17" y="48" class="sans name">IDENTITY</text><text x="17" y="67" class="mono sub">equivalence · canonicalization</text></g>
  <g transform="translate(355 70)"><rect width="245" height="80" rx="12" fill="#0b1e2e" stroke="#285a70"/><text x="17" y="23" class="mono idx">02 · RETRIES / DEADLINES</text><text x="17" y="48" class="sans name">TIME</text><text x="17" y="67" class="mono sub">intent · exhaustion · ordering</text></g>
  <g transform="translate(600 70)"><rect width="245" height="80" rx="12" fill="#0b1e2e" stroke="#285a70"/><text x="17" y="23" class="mono idx">03 · BYTES / TEXT</text><text x="17" y="48" class="sans name">ENCODING</text><text x="17" y="67" class="mono sub">Unicode · serialization · parsing</text></g>
  <g transform="translate(900 91)"><rect width="245" height="80" rx="12" fill="#0b1e2e" stroke="#39785b"/><text x="17" y="23" class="mono idx">04 · INPUT / EXECUTION</text><text x="17" y="48" class="sans name">TRUST</text><text x="17" y="67" class="mono sub">credentials · isolation · egress</text></g>
  <g transform="translate(743 282)"><rect width="245" height="80" rx="12" fill="#0b1e2e" stroke="#39785b"/><text x="17" y="23" class="mono idx">05 · LOAD / DISTRIBUTION</text><text x="17" y="48" class="sans name">SCALE</text><text x="17" y="67" class="mono sub">memory · aggregation · resume</text></g>
  <g transform="translate(212 282)"><rect width="245" height="80" rx="12" fill="#0b1e2e" stroke="#39785b"/><text x="17" y="23" class="mono idx">06 · PAGE / SHUTDOWN</text><text x="17" y="48" class="sans name">STATE</text><text x="17" y="67" class="mono sub">pagination · flush · recovery</text></g>
</svg>
