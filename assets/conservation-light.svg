<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">The Conservation Lab</title><desc id="desc">A museum conservation label showing broken system invariants repaired in public with preserved provenance.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf6ed"/><stop offset="1" stop-color="#fffaf2"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4059c7"/><stop offset=".5" stop-color="#8b4ca8"/><stop offset="1" stop-color="#c74f3d"/></linearGradient><pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r=".6" fill="#322b24" opacity=".04"/><circle cx="15" cy="14" r=".5" fill="#322b24" opacity=".03"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.serif{font-family:Georgia,"Times New Roman",serif}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.seam{stroke-dasharray:4 7;animation:repair 6s linear infinite}.pulse{animation:pulse 3.5s ease-in-out infinite}@keyframes repair{to{stroke-dashoffset:-88}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.seam,.pulse{animation:none}}</style></defs>
  <rect x="1" y="1" width="1198" height="408" rx="22" fill="url(#bg)" stroke="#b5a68e" stroke-width="2"/><rect x="1" y="1" width="1198" height="408" rx="22" fill="url(#grain)"/><text x="42" y="44" class="mono" fill="#62594e" font-size="10" letter-spacing="2.1">MUSEUM OF EDGE CASES // RESEARCH WING</text><text x="1158" y="44" class="mono" fill="#82786a" font-size="9" letter-spacing="1.5" text-anchor="end">PROVENANCE PRESERVED</text><text x="55" y="122" class="serif" fill="#2c2823" font-size="49" font-weight="700">THE CONSERVATION</text><text x="55" y="174" class="serif" fill="url(#accent)" font-size="49" font-style="italic">LAB</text><text x="57" y="221" class="serif" fill="#554d43" font-size="20" font-style="italic">Restoring broken invariants in public.</text><text x="58" y="262" class="mono" fill="#72695e" font-size="10" letter-spacing="1.4">OBSERVE → ISOLATE → REPAIR → VERIFY</text>
  <g transform="translate(55 316)" class="mono" font-size="9"><text fill="#7c7265" letter-spacing="1.4">CATALOGUE FIELDS</text><text x="166" fill="#37312b">FAULT</text><text x="236" fill="#918677">/</text><text x="259" fill="#37312b">IMPLEMENTATION</text><text x="388" fill="#918677">/</text><text x="411" fill="#37312b">OUTCOME</text><text x="493" fill="#918677">/</text><text x="516" fill="#37312b">SHIP ACTOR</text></g>
  <g transform="translate(870 213)"><circle r="142" fill="none" stroke="#d8ccbb"/><circle r="116" fill="none" stroke="#b7aa96" stroke-dasharray="2 8"/><path d="M-79-86L-8-116 25-58-4-4-74-16Z" fill="#f1e9dc" stroke="#4059c7"/><path d="M31-54L88-79 111-4 52 31-2-1Z" fill="#f1e9dc" stroke="#c74f3d"/><path d="M-76-10L-7 2 46 37 30 105-54 90-104 38Z" fill="#f1e9dc" stroke="#8b4ca8"/><path d="M-8-116L31-54M25-58L52 31M-4-4L-7 2M46 37L30 105" fill="none" stroke="#b47a08" stroke-width="3" filter="url(#glow)" class="seam"/><circle cx="-7" cy="1" r="7" fill="#b47a08" filter="url(#glow)" class="pulse"/><text x="0" y="-145" class="mono" fill="#796f62" font-size="8" letter-spacing="1.4" text-anchor="middle">INVARIANT // RESTORED</text><text x="0" y="151" class="serif" fill="#5d5449" font-size="15" font-style="italic" text-anchor="middle">the seam remains visible</text></g>
</svg>
