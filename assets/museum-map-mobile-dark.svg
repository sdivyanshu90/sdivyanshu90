<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc">
  <title id="title">Mobile floor plan of the Museum of Edge Cases</title><desc id="desc">A vertical route through six galleries orbiting the central Reality Atrium.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111116"/><stop offset="1" stop-color="#0c0d11"/></linearGradient><linearGradient id="route" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8ca2ff"/><stop offset=".5" stop-color="#d89cff"/><stop offset="1" stop-color="#ff8a76"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#d9cfbe" opacity=".12"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.serif{font-family:Georgia,"Times New Roman",serif}.room{fill:#17171d;stroke:#756e63;stroke-width:1.5}.code{fill:#938b7e;font-size:13px;letter-spacing:1.8px}.name{fill:#ede6da;font-size:23px;font-weight:700}.artifact{fill:#aaa297;font-size:13px}.path{stroke-dasharray:6 11;animation:route 8s linear infinite}.visitor{offset-path:path("M360 1254 V1128 V970 V812 V654 V496 V338 V184");animation:walk 12s ease-in-out infinite alternate}@keyframes route{to{stroke-dashoffset:-170}}@keyframes walk{to{offset-distance:100%}}@media(prefers-reduced-motion:reduce){.path,.visitor{animation:none}.visitor{display:none}}</style></defs>
  <rect x="1" y="1" width="718" height="1318" rx="28" fill="url(#bg)" stroke="#554f47" stroke-width="2"/><rect x="1" y="1" width="718" height="1318" rx="28" fill="url(#dots)"/>
  <text x="40" y="52" class="mono" fill="#b2a99a" font-size="14" letter-spacing="2.2">VISITOR MAP // MOBILE ROUTE</text><text x="680" y="52" class="mono" fill="#716a60" font-size="10" letter-spacing="1.4" text-anchor="end">YOU ARE HERE · PROBABLY</text>
  <path d="M360 1254V184" stroke="#302f36" stroke-width="38"/><path d="M360 1254V184" stroke="url(#route)" stroke-width="2" class="path"/>
  <g transform="translate(60 94)"><rect width="600" height="132" fill="#111116" stroke="#d89cff" stroke-width="2"/><rect x="12" y="12" width="576" height="108" fill="none" stroke="#6d5d75" stroke-dasharray="4 8"/><text x="300" y="45" class="mono" fill="#8e8190" font-size="12" letter-spacing="2.4" text-anchor="middle">CENTRAL ATRIUM</text><text x="300" y="82" class="serif" fill="#f1e8db" font-size="35" text-anchor="middle">REALITY</text><text x="300" y="108" class="serif" fill="#bdafbd" font-size="17" font-style="italic" text-anchor="middle">the permanent stress test</text></g>
  <g transform="translate(60 260)"><rect class="room" width="600" height="138" rx="3"/><rect width="7" height="138" fill="#8ca2ff"/><text x="30" y="34" class="mono code">GALLERY 01 · EVALUATION</text><text x="30" y="73" class="serif name">THE HALL OF FALSE CONFIDENCE</text><text x="30" y="108" class="mono artifact">ON VIEW · EVALFORGE</text><circle cx="548" cy="69" r="22" fill="none" stroke="#8ca2ff"/><path d="M536 69H560M548 57V81" stroke="#8ca2ff" stroke-width="2"/></g>
  <g transform="translate(60 418)"><rect class="room" width="600" height="138" rx="3"/><rect width="7" height="138" fill="#9a94ff"/><text x="30" y="31" class="mono code">GALLERY 02 · DEBUGGING</text><text x="30" y="65" class="serif name">THE CHECKPOINT THAT</text><text x="30" y="91" class="serif name">CHANGED ITS MIND</text><text x="30" y="120" class="mono artifact">ON VIEW · NEURAL BISECT</text><circle cx="548" cy="69" r="22" fill="none" stroke="#9a94ff"/><path d="M535 69H561M548 56V82M538 59L558 79" stroke="#9a94ff" stroke-width="2"/></g>
  <g transform="translate(60 576)"><rect class="room" width="600" height="138" rx="3"/><rect width="7" height="138" fill="#be94ff"/><text x="30" y="34" class="mono code">GALLERY 03 · EFFICIENCY</text><text x="30" y="73" class="serif name">THE COMPRESSION CHAMBER</text><text x="30" y="108" class="mono artifact">ON VIEW · FROM-SCRATCH QUANTIZATION</text><path d="M528 55H568V83H528Z" fill="none" stroke="#be94ff" stroke-width="2"/><path d="M538 62V76M548 62V76M558 62V76" stroke="#be94ff"/></g>
  <g transform="translate(60 734)"><rect class="room" width="600" height="138" rx="3"/><rect width="7" height="138" fill="#df92e5"/><text x="30" y="34" class="mono code">GALLERY 04 · ROUTING</text><text x="30" y="73" class="serif name">THE VANISHING PROVIDER</text><text x="30" y="108" class="mono artifact">ON VIEW · AI GATEWAY</text><circle cx="548" cy="69" r="22" fill="none" stroke="#df92e5"/><path d="M535 69H561" stroke="#df92e5" stroke-width="2"/></g>
  <g transform="translate(60 892)"><rect class="room" width="600" height="138" rx="3"/><rect width="7" height="138" fill="#ef8eb6"/><text x="30" y="34" class="mono code">GALLERY 05 · SCALE</text><text x="30" y="73" class="serif name">THE DISTRIBUTED LABYRINTH</text><text x="30" y="108" class="mono artifact">ON VIEW · DISTRIBUTED TRAINING</text><path d="M530 58H545V80H560M537 69H553" fill="none" stroke="#ef8eb6" stroke-width="2"/></g>
  <g transform="translate(60 1050)"><rect class="room" width="600" height="138" rx="3"/><rect width="7" height="138" fill="#ff8a76"/><text x="30" y="34" class="mono code">GALLERY 06 · SECURITY</text><text x="30" y="73" class="serif name">THE CONTAINMENT WING</text><text x="30" y="108" class="mono artifact">ON VIEW · CODE INTERPRETER</text><path d="M528 61V88H568V61L548 48Z" fill="none" stroke="#ff8a76" stroke-width="2"/><circle cx="548" cy="70" r="7" fill="none" stroke="#ff8a76"/></g>
  <g transform="translate(294 1230)"><path d="M0 0H132L116 42H16Z" fill="#1a1920" stroke="#8a8173"/><text x="66" y="27" class="mono" fill="#d8cebf" font-size="12" letter-spacing="1.8" text-anchor="middle">ENTRANCE</text></g><circle cx="360" cy="1254" r="9" fill="#ff8a76" filter="url(#glow)" class="visitor"/>
</svg>
