<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">The Conservation Lab</title><desc id="desc">A museum conservation label showing broken system invariants repaired in public with preserved provenance.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111116"/><stop offset="1" stop-color="#0c0d11"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8ca2ff"/><stop offset=".5" stop-color="#d89cff"/><stop offset="1" stop-color="#ff8a76"/></linearGradient><pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r=".6" fill="#fff" opacity=".035"/><circle cx="15" cy="14" r=".5" fill="#fff" opacity=".025"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.serif{font-family:Georgia,"Times New Roman",serif}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.seam{stroke-dasharray:4 7;animation:repair 6s linear infinite}.pulse{animation:pulse 3.5s ease-in-out infinite}@keyframes repair{to{stroke-dashoffset:-88}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.seam,.pulse{animation:none}}</style></defs>
  <rect x="1" y="1" width="1198" height="408" rx="22" fill="url(#bg)" stroke="#625a4e" stroke-width="2"/><rect x="1" y="1" width="1198" height="408" rx="22" fill="url(#grain)"/><text x="42" y="44" class="mono" fill="#aaa194" font-size="10" letter-spacing="2.1">MUSEUM OF EDGE CASES // RESEARCH WING</text><text x="1158" y="44" class="mono" fill="#756e64" font-size="9" letter-spacing="1.5" text-anchor="end">PROVENANCE PRESERVED</text>
  <text x="55" y="122" class="serif" fill="#f0e9de" font-size="49" font-weight="700">THE CONSERVATION</text><text x="55" y="174" class="serif" fill="url(#accent)" font-size="49" font-style="italic">LAB</text><text x="57" y="221" class="serif" fill="#c9c0b4" font-size="20" font-style="italic">Restoring broken invariants in public.</text><text x="58" y="262" class="mono" fill="#898276" font-size="10" letter-spacing="1.4">OBSERVE → ISOLATE → REPAIR → VERIFY</text>
  <g transform="translate(55 316)" class="mono" font-size="9"><text fill="#8e867a" letter-spacing="1.4">CATALOGUE FIELDS</text><text x="166" fill="#d9d1c5">FAULT</text><text x="236" fill="#6e685f">/</text><text x="259" fill="#d9d1c5">IMPLEMENTATION</text><text x="388" fill="#6e685f">/</text><text x="411" fill="#d9d1c5">OUTCOME</text><text x="493" fill="#6e685f">/</text><text x="516" fill="#d9d1c5">SHIP ACTOR</text></g>
  <g transform="translate(870 213)"><circle r="142" fill="none" stroke="#393630"/><circle r="116" fill="none" stroke="#4f4940" stroke-dasharray="2 8"/><path d="M-79-86L-8-116 25-58-4-4-74-16Z" fill="#24242b" stroke="#8ca2ff"/><path d="M31-54L88-79 111-4 52 31-2-1Z" fill="#24242b" stroke="#ff8a76"/><path d="M-76-10L-7 2 46 37 30 105-54 90-104 38Z" fill="#24242b" stroke="#d89cff"/><path d="M-8-116L31-54M25-58L52 31M-4-4L-7 2M46 37L30 105" fill="none" stroke="#ffd166" stroke-width="3" filter="url(#glow)" class="seam"/><circle cx="-7" cy="1" r="7" fill="#ffd166" filter="url(#glow)" class="pulse"/><text x="0" y="-145" class="mono" fill="#8b8378" font-size="8" letter-spacing="1.4" text-anchor="middle">INVARIANT // RESTORED</text><text x="0" y="151" class="serif" fill="#d8d0c5" font-size="15" font-style="italic" text-anchor="middle">the seam remains visible</text></g>
</svg>
