<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Open Source Black Box</title><desc id="desc">A flight-recorder interface representing evidence from fault reproduction through upstream resolution.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcfd"/><stop offset="1" stop-color="#f5f1eb"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#ddd5c9" opacity=".6"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.wave{stroke-dasharray:7 9;animation:move 8s linear infinite}@keyframes move{to{stroke-dashoffset:-128}}@media(prefers-reduced-motion:reduce){.wave{animation:none}}</style></defs>
  <rect x="1" y="1" width="1198" height="358" rx="22" fill="url(#bg)" stroke="#d0c5b6" stroke-width="2"/><rect x="1" y="1" width="1198" height="358" rx="22" fill="url(#grid)"/>
  <circle cx="42" cy="42" r="5" fill="#d76b00" filter="url(#glow)"/><text x="59" y="47" class="mono" fill="#4c5d69" font-size="12" letter-spacing="2">OSS // FLIGHT RECORDER</text><text x="1158" y="47" class="mono" fill="#778690" font-size="10" letter-spacing="1.5" text-anchor="end">SYNC 2026-10-09 · EVIDENCE LOCKED</text>
  <text x="56" y="120" class="sans" fill="#243b48" font-size="39" font-weight="760">OPEN SOURCE</text><text x="56" y="165" class="sans" fill="#c96000" font-size="39" font-weight="760">BLACK BOX</text><text x="58" y="201" class="mono" fill="#6c7c86" font-size="11" letter-spacing="1.2">FAULT → REPRODUCTION → PATCH → OUTCOME</text>
  <path d="M440 164H493L512 127 540 212 568 147 596 181 622 107 653 224 684 154 715 174 744 132 775 198 805 163H1139" fill="none" stroke="#d76b00" stroke-width="2" opacity=".75" class="wave"/>
  <g class="mono" font-size="9" letter-spacing="1.3"><g transform="translate(462 100)"><circle r="6" fill="#d76b00" filter="url(#glow)"/><text x="13" y="3" fill="#536570">OBSERVE</text></g><g transform="translate(650 255)"><circle r="6" fill="#0089a4" filter="url(#glow)"/><text x="13" y="3" fill="#536570">ISOLATE</text></g><g transform="translate(848 100)"><circle r="6" fill="#168e5b" filter="url(#glow)"/><text x="13" y="3" fill="#536570">REPAIR</text></g><g transform="translate(1040 255)"><circle r="6" fill="#168e5b" filter="url(#glow)"/><text x="13" y="3" fill="#536570">VERIFY</text></g></g>
  <g transform="translate(56 276)" class="mono" font-size="10"><rect width="244" height="38" rx="8" fill="#fffdfa" stroke="#d5cabb"/><text x="14" y="24" fill="#c96000">CH01</text><text x="58" y="24" fill="#526570">EVALUATION</text><rect x="258" width="244" height="38" rx="8" fill="#fffdfa" stroke="#d5cabb"/><text x="272" y="24" fill="#c96000">CH02</text><text x="316" y="24" fill="#526570">AGENT SYSTEMS</text><rect x="516" width="244" height="38" rx="8" fill="#fffdfa" stroke="#d5cabb"/><text x="530" y="24" fill="#c96000">CH03</text><text x="574" y="24" fill="#526570">GATEWAYS</text><rect x="774" width="244" height="38" rx="8" fill="#fffdfa" stroke="#d5cabb"/><text x="788" y="24" fill="#c96000">CH04</text><text x="832" y="24" fill="#526570">SECURITY</text></g>
</svg>
