<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Admission to the Museum of Edge Cases</title><desc id="desc">A museum ticket for Divanshu Sharma's permanent collection of systems that worked perfectly until they met reality.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101116"/><stop offset=".52" stop-color="#15151b"/><stop offset="1" stop-color="#0d0e12"/></linearGradient><linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8ca2ff"/><stop offset=".52" stop-color="#d89cff"/><stop offset="1" stop-color="#ff8a76"/></linearGradient><pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#fff" opacity=".035"/><circle cx="13" cy="11" r=".5" fill="#fff" opacity=".025"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.serif{font-family:Georgia,"Times New Roman",serif}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.scan{animation:scan 4.5s ease-in-out infinite}.seal{animation:seal 3.8s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateX(0);opacity:.2}50%{transform:translateX(138px);opacity:.8}}@keyframes seal{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.scan,.seal{animation:none}}</style>
  </defs>
  <rect x="1" y="1" width="1198" height="538" rx="26" fill="url(#paper)" stroke="#6f6658" stroke-width="2"/><rect x="1" y="1" width="1198" height="538" rx="26" fill="url(#grain)"/>
  <path d="M929 20V520" stroke="#7c7162" stroke-dasharray="7 10"/><circle cx="929" cy="1" r="16" fill="#0d0e12"/><circle cx="929" cy="539" r="16" fill="#0d0e12"/>
  <rect x="42" y="42" width="8" height="456" rx="4" fill="url(#ink)"/><text x="78" y="82" class="mono" fill="#a6a196" font-size="11" letter-spacing="3">PERMANENT COLLECTION · CATALOGUE EC—090</text>
  <text x="76" y="157" class="serif" fill="#f2ecdf" font-size="65" font-weight="700" letter-spacing="-2">THE MUSEUM</text><text x="76" y="222" class="serif" fill="url(#ink)" font-size="65" font-style="italic" letter-spacing="-2">OF EDGE CASES</text>
  <path d="M78 250H855" stroke="#4d4a48"/><text x="78" y="290" class="serif" fill="#d6cec0" font-size="22" font-style="italic">Systems that worked perfectly</text><text x="78" y="320" class="serif" fill="#d6cec0" font-size="22" font-style="italic">until they met reality.</text>
  <g transform="translate(78 374)"><text class="mono" fill="#77756f" font-size="9" letter-spacing="1.6">CURATOR</text><text y="28" class="sans" fill="#ebe5da" font-size="14" font-weight="700">DIVANSHU SHARMA</text><text y="49" class="mono" fill="#8f8b82" font-size="10">APPLIED AI / ML SYSTEMS</text><text x="280" class="mono" fill="#77756f" font-size="9" letter-spacing="1.6">GALLERIES</text><text x="280" y="29" class="serif" fill="#ebe5da" font-size="21">06</text><text x="418" class="mono" fill="#77756f" font-size="9" letter-spacing="1.6">SPECIALTY</text><text x="418" y="29" class="sans" fill="#ebe5da" font-size="13" font-weight="700">BROKEN ABSTRACTIONS</text><text x="418" y="49" class="mono" fill="#8f8b82" font-size="10">RESTORED IN PUBLIC</text></g>
  <text x="882" y="481" class="serif" fill="#ffffff" opacity=".035" font-size="300" text-anchor="end">90</text>
  <g transform="translate(965 52)"><text class="mono" fill="#8f8a80" font-size="9" letter-spacing="2">ADMISSION</text><text y="49" class="serif" fill="#f2ecdf" font-size="30">ADMIT</text><text y="82" class="serif" fill="#f2ecdf" font-size="30">ONE</text><circle cx="91" cy="176" r="57" fill="none" stroke="#9a89ff" stroke-width="1.5" class="seal"/><circle cx="91" cy="176" r="45" fill="none" stroke="#9a89ff" stroke-dasharray="2 6"/><text x="91" y="169" class="mono" fill="#c8bbff" font-size="9" letter-spacing="1.5" text-anchor="middle">CURATED</text><text x="91" y="188" class="serif" fill="#f2ecdf" font-size="19" text-anchor="middle">DIV/90</text><text y="275" class="mono" fill="#8f8a80" font-size="9" letter-spacing="1.5">TICKET NO.</text><text y="301" class="mono" fill="#f2ecdf" font-size="15" letter-spacing="2">EC-090-∞</text>
    <g transform="translate(0 336)" fill="#d5cdbc"><rect width="3" height="70"/><rect x="7" width="1" height="70"/><rect x="12" width="5" height="70"/><rect x="21" width="2" height="70"/><rect x="28" width="7" height="70"/><rect x="39" width="2" height="70"/><rect x="47" width="4" height="70"/><rect x="56" width="1" height="70"/><rect x="62" width="6" height="70"/><rect x="73" width="3" height="70"/><rect x="82" width="8" height="70"/><rect x="95" width="2" height="70"/><rect x="102" width="5" height="70"/><rect x="113" width="2" height="70"/><rect x="121" width="8" height="70"/><rect x="135" width="3" height="70"/></g><rect y="332" width="4" height="78" fill="#ff8a76" filter="url(#glow)" class="scan"/><text y="433" class="mono" fill="#827e75" font-size="8" letter-spacing="1.1">VALID IN PRODUCTION</text></g>
</svg>
