<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title desc">
  <title id="title">Mobile admission ticket to the Museum of Edge Cases</title><desc id="desc">A narrow-screen museum ticket for Divanshu Sharma's collection of systems that met reality.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf7ed"/><stop offset="1" stop-color="#fffaf1"/></linearGradient><linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4059c7"/><stop offset=".5" stop-color="#8b4ca8"/><stop offset="1" stop-color="#c74f3d"/></linearGradient><pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#342e28" opacity=".04"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.serif{font-family:Georgia,"Times New Roman",serif}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.scan{animation:scan 4.5s ease-in-out infinite}.seal{animation:seal 3.8s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateX(0);opacity:.2}50%{transform:translateX(156px);opacity:.8}}@keyframes seal{0%,100%{opacity:.55}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.scan,.seal{animation:none}}</style></defs>
  <rect x="1" y="1" width="718" height="918" rx="28" fill="url(#bg)" stroke="#b8a991" stroke-width="2"/><rect x="1" y="1" width="718" height="918" rx="28" fill="url(#grain)"/><rect x="36" y="36" width="8" height="625" rx="4" fill="url(#ink)"/><text x="70" y="78" class="mono" fill="#746c61" font-size="12" letter-spacing="2.4">PERMANENT COLLECTION · EC—090</text><text x="68" y="172" class="serif" fill="#25221f" font-size="70" font-weight="700">THE</text><text x="68" y="245" class="serif" fill="#25221f" font-size="70" font-weight="700">MUSEUM</text><text x="68" y="318" class="serif" fill="url(#ink)" font-size="62" font-style="italic">OF EDGE CASES</text><path d="M70 354H648" stroke="#c8baa5"/><text x="70" y="402" class="serif" fill="#514940" font-size="25" font-style="italic">Systems that worked perfectly</text><text x="70" y="438" class="serif" fill="#514940" font-size="25" font-style="italic">until they met reality.</text><text x="70" y="508" class="mono" fill="#857b6d" font-size="10" letter-spacing="1.6">CURATOR</text><text x="70" y="539" class="sans" fill="#2c2925" font-size="17" font-weight="700">DIVANSHU SHARMA</text><text x="70" y="565" class="mono" fill="#736b60" font-size="11">APPLIED AI / ML SYSTEMS ENGINEER</text><text x="70" y="616" class="mono" fill="#857b6d" font-size="10" letter-spacing="1.6">06 GALLERIES · BROKEN ABSTRACTIONS · RESTORED IN PUBLIC</text><text x="625" y="645" class="serif" fill="#251f18" opacity=".04" font-size="230" text-anchor="end">90</text><path d="M20 690H700" stroke="#ad9e87" stroke-dasharray="7 10"/><circle cx="1" cy="690" r="16" fill="#fff"/><circle cx="719" cy="690" r="16" fill="#fff"/>
  <g transform="translate(58 730)"><text class="mono" fill="#7b7164" font-size="10" letter-spacing="2">ADMISSION</text><text y="49" class="serif" fill="#29251f" font-size="34">ADMIT ONE</text><circle cx="275" cy="62" r="48" fill="none" stroke="#6a55b6" stroke-width="1.5" class="seal"/><circle cx="275" cy="62" r="37" fill="none" stroke="#6a55b6" stroke-dasharray="2 6"/><text x="275" y="58" class="mono" fill="#6553a4" font-size="8" text-anchor="middle">CURATED</text><text x="275" y="75" class="serif" fill="#29251f" font-size="16" text-anchor="middle">DIV/90</text><g transform="translate(414 7)" fill="#39342e"><rect width="3" height="91"/><rect x="8" width="2" height="91"/><rect x="15" width="7" height="91"/><rect x="28" width="3" height="91"/><rect x="38" width="8" height="91"/><rect x="52" width="2" height="91"/><rect x="61" width="5" height="91"/><rect x="74" width="3" height="91"/><rect x="84" width="8" height="91"/><rect x="99" width="3" height="91"/><rect x="109" width="6" height="91"/><rect x="123" width="2" height="91"/><rect x="132" width="8" height="91"/><rect x="148" width="4" height="91"/></g><rect x="410" y="3" width="4" height="99" fill="#c74f3d" filter="url(#glow)" class="scan"/><text y="140" class="mono" fill="#71695e" font-size="9">TICKET EC-090-∞ · VALID IN PRODUCTION</text></g>
</svg>
